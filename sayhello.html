		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
	</head>
	<body class="is-preload">
		<!-- Wrapper -->
			<div id="wrapper">

				<!-- Header -->
					<header id="header">
						<div class="inner">

							<!-- Logo -->
								<a href="index.html" class="logo">
									<span>JO</span><span>SS</span>
								</a>

							<!-- Nav -->
								<nav>
									<ul>
										<li><a href="aboutme.html">about me</a></li>
										<li><a href="archive.html">archive</a></li>
										<li><a href="sayhello.html" class="say-hello active">Say hello</a></li>
									</ul>
								</nav>

						</div>
					</header>

				<!-- Main -->
					<div id="main">
						<div class="inner">

							<section id="sayhello-intro">
							<h1><span class="sayhello-highlight">Let's talk ☕</span></h1>
							<p class="sayhello-sub">For questions, projects &amp; coffee.<br />Based in Madrid, available worldwide.</p>
						</section>

						<section id="sayhello">
								<div class="sayhello-image">
									<img src="assets/gifs/message.gif" alt="" />
								</div>
								<div class="sayhello-form">
									<p class="sayhello-form-label">Fill out the form below</p>
									<form method="post" action="#">
										<div class="fields">
											<div class="field">
												<label class="sayhello-field-label">Name</label>
											</div>
											<div class="field half">
												<input type="text" name="firstname" placeholder="First Name" />
											</div>
											<div class="field half">
												<input type="text" name="lastname" placeholder="Last Name" />
											</div>
											<div class="field">
												<label class="sayhello-field-label">Email Address</label>
												<input type="email" name="email" placeholder="hello@example.com" />
											</div>
											<div class="field">
												<label class="sayhello-field-label">Subject</label>
												<input type="text" name="subject" placeholder="What's it about?" />
											</div>
											<div class="field">
												<label class="sayhello-field-label">Message</label>
												<textarea name="message" placeholder="Tell me more..." rows="4"></textarea>
											</div>
										</div>
										<ul class="actions">
											<li><input type="submit" value="submit" class="primary" /></li>
										</ul>
									</form>
								</div>
							</section>

						</div>
					</div>

				<!-- Footer -->
					<footer id="footer">
						<div class="inner">
							<div class="footer-bottom">
								<ul class="copyright">
									<li>Jossen Zambrano &nbsp;|&nbsp; jossen1@outlook.es &nbsp;|&nbsp; &copy; 2026 &nbsp;|&nbsp; 📍 Based in Madrid. <span class="footer-available">available worldwide</span></li>
								</ul>
								<section class="footer-social">
									<ul class="icons">
										<li><a href="#" class="icon brands style2 fa-instagram"><span class="label">Instagram</span></a></li>
										<li><a href="#" class="icon brands style2 fa-behance"><span class="label">Behance</span></a></li>
										<li><a href="#" class="icon brands style2 fa-linkedin"><span class="label">LinkedIn</span></a></li>
									</ul>
								</section>
							</div>
						</div>
					</footer>

			</div>

		<!-- Scripts -->
