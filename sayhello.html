<html>
  <head>
    <title>Contact</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <link
      rel="icon"
      type="image/png"
      href="images/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="images/favicon/favicon.svg" />
    <link rel="shortcut icon" href="images/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="images/favicon/site.webmanifest" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <noscript><link rel="stylesheet" href="assets/css/noscriptss" /></noscript>
  </head>
  <body class="is-preload home sayhi">
    <!-- Wrapper -->
    <div id="wrapper">
      <!-- Header -->
      <header id="header">
        <div class="inner">
          <!-- Logo -->
          <a href="index.html" class="logo" aria-label="JOSS"
            ><span class="logo-mark"></span
          ></a>

          <!-- Nav -->
          <nav>
            <ul>
              <li><a href="aboutme.html">About</a></li>
              <li><a href="archive.html">Archive</a></li>
              <li>
                <a href="sayhello.html" class="say-hello active">Say hi!</a>
              </li>
            </ul>
          </nav>
          <button class="hamburger" id="hamburger" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <a
            href="sayhello.html#sayhello-form"
            class="header-msg icon fa-envelope"
            aria-label="Say hi"
            ><span class="label">Say hi</span></a
          >
        </div>
      </header>

      <!-- Main -->
      <div id="main">
        <div class="inner">
          <section id="sayhello-intro">
            <h1>Let's talk</h1>
            <p class="sayhello-sub">
              Available for questions, collaborations, projects & coffee.
            </p>
          </section>

          <section id="sayhello">
            <div class="sayhello-image">
              <img src="assets/gifs/message.gif" alt="" />
            </div>
            <div class="sayhello-form">
              <div data-fs-success class="sayhello-toast">
                Thanks for your message, I'll be in touch ASAP!
              </div>
              <div data-fs-error class="sayhello-error"></div>
              <form
                id="sayhello-form"
                method="post"
                action="https://formspree.io/f/mjgdzlav"
              >
                <div class="fields">
                  <div class="field">
                    <label class="sayhello-field-label">Name</label>
                    <input
                      type="text"
                      name="name"
                      placeholder="Full name"
                      data-fs-field
                    />
                    <span data-fs-error="name"></span>
                  </div>
                  <div class="field">
                    <label class="sayhello-field-label">Email Address</label>
                    <input
                      type="email"
                      name="email"
                      placeholder="hello@example.com"
                      data-fs-field
                    />
                    <span data-fs-error="email"></span>
                  </div>
                  <div class="field">
                    <label class="sayhello-field-label">Subject</label>
                    <input
                      type="text"
                      name="subject"
                      placeholder="What's it about?"
                      data-fs-field
                    />
                    <span data-fs-error="subject"></span>
                  </div>
                  <div class="field">
                    <label class="sayhello-field-label">Message</label>
                    <textarea
                      name="message"
                      placeholder="Tell me more..."
                      rows="4"
                      data-fs-field
                    ></textarea>
                    <span data-fs-error="message"></span>
                  </div>
                </div>
                <ul class="actions">
                  <li>
                    <button
                      type="submit"
                      class="primary submit-cta"
                      data-fs-submit-btn
                    >
                      Submit
                    </button>
                  </li>
                </ul>
              </form>
            </div>
          </section>
        </div>
      </div>

      <!-- Footer -->
      <footer id="footer">
        <div class="inner">
          <div class="footer-bottom">
            <ul class="copyright">
              <li>
                Jossen Zambrano<span class="footer-extra">
                  &nbsp;|&nbsp; jossenzr@gmail.com</span
                >
                &nbsp;|&nbsp; &copy; 2026<span class="footer-extra">
                  &nbsp;|&nbsp; 📍 Based in Madrid.</span
                >
              </li>
            </ul>
            <section class="footer-social">
              <ul class="icons">
                <li>
                  <a
                    href="https://www.instagram.com/hellojossi"
                    target="_blank"
                    rel="noopener"
                    class="icon brands style2 fa-instagram"
                    ><span class="label">Instagram</span></a
                  >
                </li>
                <li>
                  <a
                    href="https://www.linkedin.com/in/jossenz"
                    target="_blank"
                    rel="noopener"
                    class="icon brands style2 fa-linkedin"
                    ><span class="label">LinkedIn</span></a
                  >
                </li>
              </ul>
            </section>
          </div>
        </div>
      </footer>
    </div>

    <!-- Scripts -->
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/browser.min.js"></script>
    <script src="assets/js/breakpoints.min.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/hamburger.js"></script>
    <script>
      window.formspree =
        window.formspree ||
        function () {
          (formspree.q = formspree.q || []).push(arguments);
        };
      formspree("initForm", {
        formElement: "#sayhello-form",
        formId: "mjgdzlav",
      });

      var toast = document.querySelector("[data-fs-success]");
      new MutationObserver(function () {
        if (toast.style.display !== "none" && toast.style.display !== "") {
          setTimeout(function () {
            toast.classList.add("sayhello-toast--out");
            setTimeout(function () {
              toast.style.display = "none";
            }, 350);
          }, 5000);
        }
      }).observe(toast, { attributes: true, attributeFilter: ["style"] });
    </script>
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
  </body>
</html>
